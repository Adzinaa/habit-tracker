services:
  api:
    build: ./api
    ports:
      - "3001:3001"
    volumes:
      - api-data:/data # the SQLite file survives restarts and `docker compose down`
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/me').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  api-data:
